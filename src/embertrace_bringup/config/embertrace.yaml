environment_simulator_node:
  ros__parameters:
    use_sim_time: true
    odometry_topic: /husky1/odometry
    output_topic: /embertrace/raw_environment
    odom_frame: husky1_odom
    publish_rate_hz: 5.0
    random_seed: 42
    # Simulation ground truth. Other nodes must not read these two values.
    source_x: 12.0
    source_y: 7.0
    emission_strength_ppm: 120.0
    baseline_smoke_ppm: 1.0
    plume_length_m: 14.0
    plume_width_m: 1.6
    plume_expansion: 0.05
    smoke_noise_stddev: 2.0
    ambient_temperature_c: 22.0
    source_temperature_c: 110.0
    thermal_decay_m: 7.0
    # Direction the smoke travels, measured counter-clockwise from +x.
    wind_direction_rad: -2.35619449
    wind_speed_mps: 2.5

camera_verifier_node:
  ros__parameters:
    use_sim_time: true
    image_topic: /husky1/camera/image
    output_topic: /embertrace/visual_cue
    legacy_topic: /embertrace/visual_fire_cue
    required_frames: 2
    minimum_cluster: 4
    image_timeout_s: 1.0
    sample_stride: 8
    target_fraction: 0.025

perception_node:
  ros__parameters:
    use_sim_time: true
    input_topic: /embertrace/raw_environment
    output_topic: /embertrace/environment
    visual_topic: /embertrace/visual_cue
    filter_alpha: 0.4
    smoke_enter_ppm: 12.0
    smoke_exit_ppm: 8.0
    smoke_full_scale_ppm: 45.0
    baseline_smoke_ppm: 1.0
    temperature_threshold_c: 32.0
    temperature_full_scale_c: 65.0
    visual_weight: 0.15
    environment_timeout_s: 2.0
    visual_timeout_s: 1.0
    future_tolerance_s: 0.1
    warmup_samples: 3
    temperature_exit_c: 29.0

mission_manager_node:
  ros__parameters:
    use_sim_time: true
    investigate_confidence: 0.22
    track_confidence: 0.38
    verify_confidence: 0.68
    alert_confidence: 0.74
    lost_confidence: 0.12
    visual_confirmation: 0.55
    required_detection_samples: 3
    required_confirmation_samples: 3
    reading_timeout_s: 2.0
    max_estimate_age_s: 5.0
    max_estimate_stddev_m: 4.0

search_planner_node:
  ros__parameters:
    use_sim_time: true
    surge_step_m: 2.0
    cast_step_m: 2.5
    goal_interval_s: 2.0
    estimate_interval_s: 1.0
    max_samples: 160
    minimum_spacing_m: 0.3
    # Field-shape priors; these are not source coordinates.
    ambient_temperature_c: 22.0
    baseline_smoke_ppm: 1.0
    thermal_decay_m: 7.0
    plume_length_m: 14.0
    plume_width_m: 1.6
    plume_expansion: 0.05
    map_topic: /husky1/map
    robot_clearance_m: 0.8
    max_map_occupancy: 20
    goal_snap_radius_m: 2.0
    reading_timeout_s: 3.0
    signal_loss_timeout_s: 20.0
    search_timeout_s: 120.0
    world_min_x: -18.5
    world_max_x: 18.5
    world_min_y: -18.5
    world_max_y: 18.5

heatmap_node:
  ros__parameters:
    use_sim_time: true
    max_samples: 300
    minimum_spacing_m: 0.35
    display_max_smoke_ppm: 60.0

patrol_manager_node:
  ros__parameters:
    use_sim_time: true
    # waypoints_file is supplied by embertrace_demo.launch.py, which
    # resolves it to the installed path of patrol_waypoints.yaml.
    base_waypoint_name: ranger_base
    # A waypoint counts as reached inside this radius. It MUST be larger than
    # Nav2's xy_goal_tolerance (1.0 m in embertrace_sim/config/
    # nav2_params_husky1.yaml): Nav2 stops the rover as soon as it is inside
    # its own tolerance, so a smaller value here stalls the patrol short of
    # the waypoint. Keep it well below the spacing between waypoints (~4 m).
    arrival_tolerance_m: 1.2
    base_frame: husky1_base_link   # robot pose is read from TF: frame_id -> base_frame
    frame_id: husky1_odom
    status_topic: /embertrace/navigation_status
    retry_delay_s: 2.0       # wait before re-sending a goal the adapter dropped/aborted
    goal_timeout_s: 90.0     # re-send a goal that has not completed after this long
    max_goal_attempts: 3     # then skip that waypoint and carry on with the loop
    min_success_age_s: 1.0   # ignore a SUCCEEDED this soon after a new goal (stale)

# Goals outside this box are rejected by the adapter (status OUT_OF_BOUNDS).
# Keep in step with search_planner_node's world_min/max above. For the dense
# 70 m world (embertrace_forest_dense.sdf) the fences are at +/-34.7, so use
# about +/-33.5 if you want search goals to reach the outer forest.
nav2_goal_adapter_node:
  ros__parameters:
    use_sim_time: true
    # The adapter's defaults are for a single un-namespaced robot ("/navigate_to_pose").
    # Nav2 here runs inside the husky1 namespace, so without these four lines
    # the adapter waits forever for "/navigate_to_pose" and the rover never moves.
    robot_namespace: husky1
    action_name: /husky1/navigate_to_pose
    odom_topic: /husky1/odometry
    odom_frame: husky1_odom
    map_frame: husky1_map
    max_goal_age_s: 5.0
    pending_timeout_s: 15.0
    world_min_x: -18.5
    world_max_x: 18.5
    world_min_y: -18.5
    world_max_y: 18.5

sensor_health_node:
  ros__parameters:
    robot: husky1
    environment_topic: /embertrace/raw_environment
    ready_topic: /embertrace/sensors_ready
    sensor_timeout_s: 2.0

drone_sensor_health_node:
  ros__parameters:
    robot: drone1
    environment_topic: /drone1/raw_environment
    ready_topic: /drone1/sensors_ready
    sensor_timeout_s: 2.0

drone_environment_simulator_node:
  ros__parameters:
    odometry_topic: /drone1/odometry
    odom_frame: husky1_odom
    output_topic: /drone1/raw_environment
    truth_topic: /drone1/validation/truth
    publish_rate_hz: 5.0
    random_seed: 43
    source_x: 12.0
    source_y: 7.0
    wind_direction_rad: -2.35619449
    altitude_decay_m: 8.0

drone_camera_verifier_node:
  ros__parameters:
    image_topic: /drone1/camera/image
    output_topic: /drone1/visual_cue
    legacy_topic: /drone1/visual_fire_cue
    sample_stride: 4
    target_fraction: 0.025
    required_frames: 2
    minimum_cluster: 4
    image_timeout_s: 1.0

drone_perception_node:
  ros__parameters:
    input_topic: /drone1/raw_environment
    output_topic: /drone1/environment
    visual_topic: /drone1/visual_cue
    status_topic: /drone1/perception_status
    environment_timeout_s: 2.0
    visual_timeout_s: 1.0
    warmup_samples: 3

drone_scout_node:
  ros__parameters:
    altitude_m: 8.0
    max_speed_mps: 1.5
    sweep_x: [-12.0, 12.0, 12.0, -12.0, -12.0, 12.0]
    sweep_y: [-8.0, -8.0, 0.0, 0.0, 8.0, 8.0]

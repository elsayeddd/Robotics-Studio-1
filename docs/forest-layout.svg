<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">EmberTrace simulated forest layout</title>
  <desc id="desc">Top-down schematic showing the patrol trail, ranger base, environmental stations, fire source, wind direction and forest obstacles.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d97706"/>
    </marker>
    <style>
      .label{font:600 14px sans-serif;fill:#17211b}.small{font:12px sans-serif;fill:#25352b}
      .tree{fill:#2f6f3e;stroke:#174425;stroke-width:2}.station{fill:#f5c542;stroke:#725d00;stroke-width:2}
    </style>
  </defs>
  <rect width="900" height="760" fill="#f5f2e9"/>
  <text x="40" y="42" font-family="sans-serif" font-size="25" font-weight="700" fill="#193526">EmberTrace forest world — top view</text>
  <text x="40" y="66" class="small">40 m × 40 m schematic; coordinates are relative to the simulation origin.</text>
  <g transform="translate(40,90)">
    <rect x="0" y="0" width="640" height="640" rx="5" fill="#78925b" stroke="#4b2f16" stroke-width="8"/>
    <!-- Patrol trail -->
    <path d="M160 560 L160 160 L480 160 L480 320 L160 320" fill="none" stroke="#b98b57" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M96 544 L160 480" fill="none" stroke="#b98b57" stroke-width="36" stroke-linecap="round"/>
    <path d="M160 560 L160 160 L480 160 L480 320 L160 320" fill="none" stroke="#e2c091" stroke-width="3" stroke-dasharray="10 8"/>

    <!-- Trees -->
    <g>
      <circle class="tree" cx="48" cy="448" r="13"/><circle class="tree" cx="64" cy="304" r="13"/>
      <circle class="tree" cx="48" cy="192" r="13"/><circle class="tree" cx="112" cy="64" r="13"/>
      <circle class="tree" cx="224" cy="64" r="13"/><circle class="tree" cx="336" cy="64" r="13"/>
      <circle class="tree" cx="448" cy="64" r="13"/><circle class="tree" cx="576" cy="80" r="13"/>
      <circle class="tree" cx="576" cy="288" r="13"/><circle class="tree" cx="592" cy="416" r="13"/>
      <circle class="tree" cx="560" cy="544" r="13"/><circle class="tree" cx="432" cy="576" r="13"/>
      <circle class="tree" cx="320" cy="560" r="13"/><circle class="tree" cx="224" cy="592" r="13"/>
      <circle class="tree" cx="240" cy="416" r="13"/><circle class="tree" cx="336" cy="416" r="13"/>
      <circle class="tree" cx="400" cy="240" r="13"/><circle class="tree" cx="256" cy="240" r="13"/>
    </g>

    <!-- Base -->
    <rect x="36" y="520" width="72" height="54" rx="5" fill="#334d38" stroke="#15261a" stroke-width="3"/>
    <circle cx="96" cy="544" r="10" fill="#2b6cb0" stroke="white" stroke-width="3"/>
    <text x="18" y="608" class="label">Ranger base + rover start</text>

    <!-- Sensor stations -->
    <rect class="station" x="150" y="390" width="20" height="20"/><text x="176" y="405" class="small">S1</text>
    <rect class="station" x="246" y="310" width="20" height="20"/><text x="272" y="325" class="small">S2</text>
    <rect class="station" x="358" y="150" width="20" height="20"/><text x="384" y="165" class="small">S3</text>
    <rect class="station" x="470" y="246" width="20" height="20"/><text x="496" y="261" class="small">S4</text>

    <!-- Fire and wind -->
    <circle cx="512" cy="208" r="18" fill="#dc2626" stroke="#7f1d1d" stroke-width="4"/>
    <path d="M512 208 C505 195 520 190 514 176 C532 188 538 199 530 211 Z" fill="#fbbf24"/>
    <text x="540" y="207" class="label">Fire source (12, 7)</text>
    <line x1="500" y1="220" x2="390" y2="330" stroke="#d97706" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="440" y="292" class="label" fill="#92400e">Smoke travels SW</text>

    <!-- Water point and obstacles -->
    <circle cx="64" cy="88" r="18" fill="#3aa7d8" stroke="#075985" stroke-width="3"/>
    <text x="90" y="94" class="small">Water tank</text>
    <g fill="#66645d" stroke="#34332f" stroke-width="2">
      <circle cx="208" cy="368" r="11"/><circle cx="368" cy="275" r="11"/><circle cx="432" cy="104" r="11"/>
    </g>
    <g stroke="#6b3214" stroke-width="13" stroke-linecap="round">
      <line x1="225" y1="120" x2="270" y2="135"/><line x1="390" y1="360" x2="430" y2="330"/>
    </g>

    <!-- Axes -->
    <line x1="320" y1="640" x2="320" y2="0" stroke="#ffffff" stroke-opacity="0.24"/>
    <line x1="0" y1="320" x2="640" y2="320" stroke="#ffffff" stroke-opacity="0.24"/>
    <text x="326" y="18" class="small">+y</text><text x="610" y="312" class="small">+x</text>
  </g>
  <g transform="translate(715,125)">
    <text x="0" y="0" class="label">Legend</text>
    <circle class="tree" cx="12" cy="34" r="10"/><text x="32" y="39" class="small">Tree</text>
    <line x1="0" y1="70" x2="25" y2="70" stroke="#b98b57" stroke-width="16"/><text x="38" y="75" class="small">Patrol trail</text>
    <rect class="station" x="2" y="96" width="20" height="20"/><text x="38" y="112" class="small">Sensor station</text>
    <circle cx="12" cy="146" r="11" fill="#dc2626"/><text x="38" y="151" class="small">Fire source</text>
    <circle cx="12" cy="182" r="10" fill="#2b6cb0"/><text x="38" y="187" class="small">Rover start</text>
    <circle cx="12" cy="218" r="10" fill="#66645d"/><text x="38" y="223" class="small">Rock/log</text>
  </g>
</svg>


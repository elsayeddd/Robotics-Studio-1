name: ROS 2 CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ros2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container:
      image: osrf/ros:humble-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y xvfb libgl1-mesa-dri
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y --rosdistro humble
      - name: Static validation
        run: python3 scripts/validate_repo.py
      - name: Build
        id: build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          MAKEFLAGS="-j2 -l2" colcon build --parallel-workers 2 --event-handlers console_direct+
      - name: Test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          ROS_DOMAIN_ID=73 colcon test --event-handlers console_direct+
          colcon test-result --verbose

      - name: Gazebo rover and drone smoke check
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          for platform in rover drone combined; do
            xvfb-run -a python3 scripts/ros_demo_smoke.py --platform "$platform"
          done
      - name: Recorded Gazebo perception campaign
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ROS_DOMAIN_ID: "74"
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          xvfb-run -a python3 scripts/ros_perception_campaign.py
      - name: Preserve demo and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-test-logs
          path: log/
